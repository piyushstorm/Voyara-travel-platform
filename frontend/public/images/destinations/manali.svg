<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="manaliSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#manaliSky)"/>

  <!-- High Snow Peaks -->
  <polygon points="40,240 180,60 320,240" fill="#64748b"/>
  <polygon points="180,60 210,110 170,125 150,100 180,60" fill="#ffffff"/>

  <polygon points="220,240 420,30 620,240" fill="#475569"/>
  <polygon points="420,30 460,95 430,110 390,90 370,115 420,30" fill="#ffffff"/>

  <polygon points="530,240 680,80 820,240" fill="#64748b"/>
  <polygon points="680,80 710,120 670,135 650,110 680,80" fill="#ffffff"/>

  <!-- Paraglider in Sky -->
  <g transform="translate(560, 90)">
    <path d="M-40,0 Q0,-22 40,0 Q0,-8 -40,0 Z" fill="#ef4444"/>
    <path d="M-30,0 Q0,-18 30,0 Q0,-7 -30,0 Z" fill="#facc15"/>
    <line x1="-30" y1="0" x2="0" y2="35" stroke="#334155" stroke-width="1"/>
    <line x1="30" y1="0" x2="0" y2="35" stroke="#334155" stroke-width="1"/>
    <line x1="-15" y1="-3" x2="0" y2="35" stroke="#334155" stroke-width="1"/>
    <line x1="15" y1="-3" x2="0" y2="35" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="35" r="4" fill="#0f172a"/>
  </g>

  <!-- Mid Range Mountain Forest -->
  <polygon points="-50,300 150,180 350,300" fill="#166534"/>
  <polygon points="250,300 480,170 700,300" fill="#15803d"/>
  <polygon points="550,300 750,180 920,300" fill="#166534"/>

  <!-- Valley Floor -->
  <rect y="290" width="800" height="160" fill="#14532d"/>

  <!-- Winding Beas River -->
  <path d="M430,290 Q400,340 480,380 T400,450 L310,450 Q390,390 330,340 T380,290 Z" fill="url(#riverGrad)"/>

  <!-- Pine Tree Groves -->
  <g fill="url(#pineGrad)">
    <!-- Left Fore Trees -->
    <polygon points="40,430 70,260 100,430"/>
    <polygon points="80,440 115,240 150,440"/>
    <polygon points="130,420 160,270 190,420"/>
    <!-- Right Fore Trees -->
    <polygon points="630,430 660,250 690,430"/>
    <polygon points="670,440 705,230 740,440"/>
    <polygon points="720,430 750,270 780,430"/>
  </g>

  <!-- Destination Label Overlay -->
  <rect x="24" y="24" width="120" height="34" rx="8" fill="#0f172a" fill-opacity="0.6"/>
  <text x="36" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">MANALI</text>
  <text x="108" y="47" font-size="14">⛰️</text>
</svg>
