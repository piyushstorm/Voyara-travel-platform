<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sinSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="75%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sinBay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sinSky)"/>

  <!-- Moon & Clouds -->
  <circle cx="200" cy="110" r="35" fill="#fef08a" opacity="0.85"/>

  <!-- Marina Bay Sands Triple Towers & Skypark -->
  <g transform="translate(360, 290)">
    <!-- Tower 1 Left -->
    <rect x="-140" y="-170" width="34" height="170" fill="#020617"/>
    <!-- Tower 2 Center -->
    <rect x="-80" y="-170" width="34" height="170" fill="#020617"/>
    <!-- Tower 3 Right -->
    <rect x="-20" y="-170" width="34" height="170" fill="#020617"/>

    <!-- Light strips on towers -->
    <line x1="-123" y1="-165" x2="-123" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="-63" y1="-165" x2="-63" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="-3" y1="-165" x2="-3" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

    <!-- Skypark (Boat Deck on top) -->
    <path d="M-170,-170 Q-50,-185 70,-170 L55,-160 Q-50,-175 -155,-160 Z" fill="#0f172a"/>
    <path d="M-170,-170 Q-50,-182 70,-170" stroke="#c084fc" stroke-width="3" fill="none"/>
    <!-- Infinity Pool Glow -->
    <line x1="-150" y1="-172" x2="30" y2="-172" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Gardens by the Bay - Supertrees Right -->
  <g transform="translate(620, 290)">
    <!-- Supertree 1 Large -->
    <path d="M-30,0 Q-15,-70 -35,-120 L35,-120 Q15,-70 30,0 Z" fill="#0f172a"/>
    <!-- Canopy Branching -->
    <path d="M-55,-140 Q0,-105 55,-140 Q25,-120 0,-120 Q-25,-120 -55,-140 Z" fill="#020617"/>
    <!-- Neon Glowing Branches -->
    <path d="M0,-120 Q-30,-150 -55,-140" stroke="#ec4899" stroke-width="2.5" fill="none"/>
    <path d="M0,-120 Q30,-150 55,-140" stroke="#8b5cf6" stroke-width="2.5" fill="none"/>
    <path d="M0,-120 Q-15,-160 0,-155" stroke="#06b6d4" stroke-width="2" fill="none"/>

    <!-- Supertree 2 Smaller -->
    <g transform="translate(90, 0) scale(0.75)">
      <path d="M-30,0 Q-15,-70 -35,-120 L35,-120 Q15,-70 30,0 Z" fill="#0f172a"/>
      <path d="M-55,-140 Q0,-105 55,-140 Q25,-120 0,-120 Q-25,-120 -55,-140 Z" fill="#020617"/>
      <path d="M0,-120 Q-30,-150 -55,-140" stroke="#06b6d4" stroke-width="2.5" fill="none"/>
      <path d="M0,-120 Q30,-150 55,-140" stroke="#ec4899" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- Singapore Flyer (Ferris Wheel) Left Background -->
  <g transform="translate(120, 220)" opacity="0.4">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#e0e7ff" stroke-width="2"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#e0e7ff" stroke-width="1"/>
    <line x1="35" y1="-35" x2="-35" y2="35" stroke="#e0e7ff" stroke-width="1"/>
    <polygon points="-15,70 15,70 0,0" fill="#e0e7ff"/>
  </g>

  <!-- Marina Bay Waterfront -->
  <rect y="290" width="800" height="160" fill="url(#sinBay)"/>

  <!-- Spectacular Colorful Reflections in Water -->
  <g opacity="0.5">
    <ellipse cx="270" cy="330" rx="40" ry="4" fill="#38bdf8"/>
    <ellipse cx="320" cy="345" rx="50" ry="5" fill="#c084fc"/>
    <ellipse cx="620" cy="330" rx="60" ry="5" fill="#ec4899"/>
    <ellipse cx="690" cy="340" rx="40" ry="4" fill="#06b6d4"/>
  </g>

  <!-- Destination Label Overlay -->
  <rect x="24" y="24" width="145" height="34" rx="8" fill="#0f172a" fill-opacity="0.75"/>
  <text x="36" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">SINGAPORE</text>
  <text x="133" y="47" font-size="14">🌆</text>
</svg>
