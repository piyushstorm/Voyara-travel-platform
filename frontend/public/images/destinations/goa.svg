<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="goaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="goaSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="85%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goaSand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Sunset Sky -->
  <rect width="800" height="450" fill="url(#goaSky)"/>

  <!-- Golden Sun -->
  <circle cx="400" cy="220" r="55" fill="#fef08a" opacity="0.95"/>
  <circle cx="400" cy="220" r="90" fill="#fed7aa" opacity="0.4"/>

  <!-- Sea Ocean -->
  <rect y="240" width="800" height="210" fill="url(#goaSea)"/>

  <!-- Ocean Waves / Sunset Reflection -->
  <ellipse cx="400" cy="255" rx="140" ry="6" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="400" cy="275" rx="110" ry="5" fill="#fef08a" opacity="0.4"/>
  <ellipse cx="400" cy="300" rx="80" ry="4" fill="#fef08a" opacity="0.3"/>

  <!-- Golden Sand Coastline -->
  <path d="M0,320 Q250,290 500,340 T800,320 L800,450 L0,450 Z" fill="url(#goaSand)"/>

  <!-- Palm Trees Left Silhouette -->
  <g fill="#1e293b">
    <!-- Trunk 1 -->
    <path d="M60,450 Q90,320 80,200 Q75,195 85,200 Q95,320 75,450 Z"/>
    <!-- Fronds 1 -->
    <path d="M80,200 Q30,170 0,195 Q40,165 80,200 Z"/>
    <path d="M80,200 Q40,135 15,150 Q55,135 80,200 Z"/>
    <path d="M80,200 Q80,110 95,120 Q85,140 80,200 Z"/>
    <path d="M80,200 Q130,130 150,155 Q115,145 80,200 Z"/>
    <path d="M80,200 Q145,175 160,210 Q120,185 80,200 Z"/>

    <!-- Trunk 2 -->
    <path d="M140,450 Q160,350 145,240 Q140,235 150,240 Q170,350 155,450 Z"/>
    <!-- Fronds 2 -->
    <path d="M145,240 Q105,210 75,230 Q110,205 145,240 Z"/>
    <path d="M145,240 Q140,170 160,180 Q150,200 145,240 Z"/>
    <path d="M145,240 Q195,195 210,225 Q175,210 145,240 Z"/>
  </g>

  <!-- Palm Trees Right Silhouette -->
  <g fill="#1e293b">
    <path d="M720,450 Q690,330 710,210 Q715,205 705,210 Q680,330 705,450 Z"/>
    <path d="M710,210 Q655,180 630,200 Q670,175 710,210 Z"/>
    <path d="M710,210 Q710,130 690,140 Q700,160 710,210 Z"/>
    <path d="M710,210 Q765,140 785,165 Q745,155 710,210 Z"/>
    <path d="M710,210 Q780,185 800,215 Q750,195 710,210 Z"/>
  </g>

  <!-- Beach Umbrella & Loungers -->
  <g transform="translate(380, 360)">
    <polygon points="0,0 20,-25 40,0" fill="#ef4444"/>
    <polygon points="20,-25 30,-22 40,0 20,0" fill="#ffffff"/>
    <line x1="20" y1="-25" x2="20" y2="25" stroke="#78350f" stroke-width="3"/>
    <!-- Lounger -->
    <path d="M35,18 L60,12 L75,22" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Destination Label Overlay -->
  <rect x="24" y="24" width="100" height="34" rx="8" fill="#0f172a" fill-opacity="0.6"/>
  <text x="36" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">GOA</text>
  <text x="88" y="47" font-size="14">🏖️</text>
</svg>
