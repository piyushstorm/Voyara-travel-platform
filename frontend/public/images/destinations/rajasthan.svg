<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rajSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="30%" stop-color="#c2410c"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="rajDune" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rajFort" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <!-- Twilight Desert Sky -->
  <rect width="800" height="450" fill="url(#rajSky)"/>

  <!-- Desert Sun / Full Moon -->
  <circle cx="580" cy="160" r="50" fill="#fef08a" opacity="0.9"/>
  <circle cx="580" cy="160" r="85" fill="#fde68a" opacity="0.3"/>

  <!-- Majestic Fort on Ridge Silhouette -->
  <g fill="url(#rajFort)">
    <!-- Base Ridge -->
    <path d="M0,230 Q220,180 480,210 T800,195 L800,310 L0,310 Z"/>

    <!-- Fort Ramparts and Domes -->
    <!-- Tower Left -->
    <rect x="120" y="150" width="35" height="70"/>
    <path d="M115,150 Q137,130 160,150 Z"/>
    <line x1="137" y1="130" x2="137" y2="120" stroke="#fde68a" stroke-width="2"/>

    <!-- Wall with crenellations -->
    <rect x="155" y="170" width="110" height="50"/>
    <polygon points="160,170 160,162 170,162 170,170 180,170 180,162 190,162 190,170 200,170 200,162 210,162 210,170 220,170 220,162 230,162 230,170 240,170 240,162 250,162 250,170 260,170 260,162 265,162 265,170"/>

    <!-- Main Grand Palace Dome & Chhatris -->
    <rect x="265" y="130" width="80" height="90"/>
    <!-- Grand Onion Dome -->
    <path d="M280,130 Q305,80 330,130 Z"/>
    <circle cx="305" cy="80" r="3" fill="#fde68a"/>
    <line x1="305" y1="80" x2="305" y2="70" stroke="#fde68a" stroke-width="2"/>

    <!-- Chhatri 1 -->
    <rect x="355" y="160" width="28" height="60"/>
    <path d="M350,160 Q369,142 388,160 Z"/>

    <!-- Arch Gates & Windows -->
    <path d="M295,190 Q305,175 315,190 L315,220 L295,220 Z" fill="#fde68a" opacity="0.6"/>
    <circle cx="285" cy="155" r="4" fill="#fde68a" opacity="0.6"/>
    <circle cx="325" cy="155" r="4" fill="#fde68a" opacity="0.6"/>
  </g>

  <!-- Rolling Sand Dunes -->
  <path d="M-50,330 Q200,260 450,320 T850,290 L850,450 L-50,450 Z" fill="url(#rajDune)"/>
  <path d="M-50,370 Q300,330 600,390 T850,350 L850,450 L-50,450 Z" fill="#78350f"/>

  <!-- Camel Caravan Silhouette -->
  <g transform="translate(180, 310)" fill="#1c1917">
    <!-- Camel 1 -->
    <!-- Body -->
    <ellipse cx="60" cy="30" rx="20" ry="14"/>
    <!-- Hump -->
    <circle cx="62" cy="17" r="11"/>
    <!-- Neck & Head -->
    <path d="M75,32 Q90,15 88,0 Q88,-6 82,-4 L78,2 Q80,18 70,30 Z"/>
    <!-- Legs -->
    <line x1="47" y1="40" x2="44" y2="68" stroke="#1c1917" stroke-width="3"/>
    <line x1="53" y1="40" x2="52" y2="68" stroke="#1c1917" stroke-width="3"/>
    <line x1="68" y1="40" x2="68" y2="68" stroke="#1c1917" stroke-width="3"/>
    <line x1="75" y1="40" x2="78" y2="68" stroke="#1c1917" stroke-width="3"/>

    <!-- Camel 2 (Follower) -->
    <g transform="translate(70, 0)">
      <ellipse cx="60" cy="30" rx="17" ry="12"/>
      <circle cx="62" cy="19" r="9"/>
      <path d="M72,32 Q85,18 84,3 Q84,-2 79,0 L75,5 Q77,20 68,30 Z"/>
      <line x1="48" y1="38" x2="46" y2="68" stroke="#1c1917" stroke-width="2.5"/>
      <line x1="54" y1="38" x2="53" y2="68" stroke="#1c1917" stroke-width="2.5"/>
      <line x1="67" y1="38" x2="67" y2="68" stroke="#1c1917" stroke-width="2.5"/>
      <line x1="73" y1="38" x2="76" y2="68" stroke="#1c1917" stroke-width="2.5"/>
    </g>

    <!-- Caravan Guide with Turban -->
    <circle cx="25" cy="40" r="5"/>
    <ellipse cx="25" cy="38" rx="7" ry="4" fill="#ea580c"/>
    <rect x="22" y="45" width="7" height="18"/>
    <line x1="24" y1="63" x2="22" y2="70" stroke="#1c1917" stroke-width="2"/>
    <line x1="27" y1="63" x2="29" y2="70" stroke="#1c1917" stroke-width="2"/>
    <line x1="28" y1="50" x2="45" y2="40" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Destination Label Overlay -->
  <rect x="24" y="24" width="145" height="34" rx="8" fill="#451a03" fill-opacity="0.8"/>
  <text x="36" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">RAJASTHAN</text>
  <text x="133" y="47" font-size="14">🏰</text>
</svg>
