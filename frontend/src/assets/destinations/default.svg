<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="defSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#1e3a8a"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="defEarth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#defSky)"/>

  <!-- Glowing Sun / World Horizon -->
  <circle cx="400" cy="230" r="70" fill="#fef08a" opacity="0.9"/>
  <circle cx="400" cy="230" r="120" fill="#bae6fd" opacity="0.2"/>

  <!-- Majestic Mountains on Horizon -->
  <polygon points="50,260 220,120 380,260" fill="#334155" opacity="0.8"/>
  <polygon points="260,260 450,100 620,260" fill="#1e293b" opacity="0.9"/>
  <polygon points="500,260 670,130 820,260" fill="#334155" opacity="0.8"/>

  <!-- Earth Landscape Foreground -->
  <path d="M0,260 Q200,240 400,260 T800,250 L800,450 L0,450 Z" fill="url(#defEarth)"/>

  <!-- Airplane Flight Path Arc -->
  <path d="M120,340 Q400,120 680,180" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- Airplane Silhouette on Path -->
  <g transform="translate(680, 180) rotate(15) scale(0.9)" fill="#ffffff">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="22" ry="5"/>
    <!-- Wings -->
    <polygon points="-5,0 -16,-24 -6,-24 8,0"/>
    <polygon points="-5,0 -16,24 -6,24 8,0"/>
    <!-- Tail Fin -->
    <polygon points="-16,0 -24,-12 -18,-12 -12,0"/>
  </g>

  <!-- Compass Rose Watermark -->
  <g transform="translate(400, 350)" stroke="#64748b" stroke-width="2" fill="none" opacity="0.4">
    <circle cx="0" cy="0" r="40"/>
    <polygon points="0,-35 6,0 -6,0" fill="#f8fafc"/>
    <polygon points="0,35 6,0 -6,0" fill="#64748b"/>
    <polygon points="35,0 0,6 0,-6" fill="#94a3b8"/>
    <polygon points="-35,0 0,6 0,-6" fill="#94a3b8"/>
  </g>

  <!-- Destination Label Overlay -->
  <rect x="24" y="24" width="135" height="34" rx="8" fill="#0f172a" fill-opacity="0.75"/>
  <text x="36" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">VOYARA</text>
  <text x="122" y="47" font-size="14">✨</text>
</svg>
