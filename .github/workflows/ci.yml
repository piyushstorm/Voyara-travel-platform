name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
      MAVEN_OPTS: "-Xmx768m"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn clean test -B -Dsurefire.rerunFailingTestsCount=0

      - name: Dump failed test reports
        if: failure()
        run: |
          echo "=== FAILED TEST REPORTS ==="
          for f in target/surefire-reports/*.txt; do
            if grep -Eq "(FAILURE!|ERROR!|FAILURES!)" "$f" 2>/dev/null; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done
          echo "=== DUMP FILES ==="
          ls -la target/surefire-reports/*.dump* 2>/dev/null || true
          for d in target/surefire-reports/*.dump*; do
            if [ -f "$d" ]; then
              echo "Dump: $d"
              cat "$d"
            fi
          done

      - name: Package
        run: mvn clean package -DskipTests -B

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
