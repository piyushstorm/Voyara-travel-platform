services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-postgres
    environment:
      POSTGRES_DB: travel_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Remove port mapping in production; use internal networking only
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    # Remove port mapping in production; use internal networking only
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET environment variable}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_dummy}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-dummy_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_TEST_MODE: ${RAZORPAY_TEST_MODE:-true}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Voyara}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MESSAGECENTRAL_ENABLED: ${MESSAGECENTRAL_ENABLED:-false}
      MESSAGECENTRAL_CUSTOMER_ID: ${MESSAGECENTRAL_CUSTOMER_ID:-}
      MESSAGECENTRAL_EMAIL: ${MESSAGECENTRAL_EMAIL:-}
      MESSAGECENTRAL_PASSWORD: ${MESSAGECENTRAL_PASSWORD:-}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_EXPIRY_SECONDS: ${OTP_EXPIRY_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN: ${OTP_RESEND_COOLDOWN:-60}
      OTP_MAX_PER_HOUR: ${OTP_MAX_PER_HOUR:-5}
      OTP_LOCK_DURATION: ${OTP_LOCK_DURATION:-900}
      cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000,https://*.vercel.app}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY:-WARN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: travel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
