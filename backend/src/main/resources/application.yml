server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: travel-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Existing schema baseline"
    validate-on-migrate: true
    clean-disabled: true

  # HikariCP connection pool
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: ${DB_POOL_CONNECT_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      pool-name: voyara-hikari-pool

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Payment provider: 'mock' for development, 'razorpay' for Razorpay test mode
payment:
  provider: ${PAYMENT_PROVIDER:razorpay}

# Razorpay credentials (set via environment variables)
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}
  test:
    mode: ${RAZORPAY_TEST_MODE:true}

# Email configuration
email:
  provider: ${EMAIL_PROVIDER:gmail}

# App-level mail aliases kept for compatibility with existing config values
mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:}
  from-name: ${MAIL_FROM_NAME:Voyara}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

logging:
  level:
    com.travelplatform: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}

# Google OAuth
google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}

# Message Central VerifyNow OTP provider
messagecentral:
  enabled: ${MESSAGECENTRAL_ENABLED:false}
  customer-id: ${MESSAGECENTRAL_CUSTOMER_ID:}
  email: ${MESSAGECENTRAL_EMAIL:}
  password: ${MESSAGECENTRAL_PASSWORD:}

# OTP configuration
otp:
  length: ${OTP_LENGTH:6}
  expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN:60}
  max-per-hour: ${OTP_MAX_PER_HOUR:5}
  lock-duration-seconds: ${OTP_LOCK_DURATION:900}

frontend:
  base:
    url: ${FRONTEND_BASE_URL:http://localhost:5173}

# Seed data configuration for development & testing
seed:
  data:
    enabled: ${SEED_DATA_ENABLED:true}
