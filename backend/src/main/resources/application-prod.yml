# ============================================================
# PRODUCTION CONFIGURATION
# ============================================================
# Use: java -jar app.jar --spring.profiles.active=prod
# All secrets MUST come from environment variables.
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

    # HikariCP connection pool — production tuned
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECT_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_THRESHOLD:60000}
      pool-name: voyara-hikari-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway manages schema migrations in production
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Existing schema baseline"
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-threads: ${SERVER_MAX_THREADS:200}
    accept-count: ${SERVER_ACCEPT_COUNT:100}

# Payment provider
payment:
  provider: ${PAYMENT_PROVIDER:mock}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:?Set RAZORPAY_WEBHOOK_SECRET}
  test:
    mode: ${RAZORPAY_TEST_MODE:false}

# Email
email:
  provider: ${EMAIL_PROVIDER:gmail}
  from: ${EMAIL_FROM:noreply@voyara.com}
  api-key: ${EMAIL_API_KEY:}
  api-secret: ${EMAIL_API_SECRET:}
  base-url: ${EMAIL_BASE_URL:}

# CORS — restrict to your production domain and Vercel deployments
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:https://voyara.com,https://*.vercel.app,http://localhost:5173,http://localhost:5174}"

# Logging — production-safe levels
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.travelplatform: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.flywaydb: INFO

# Disable Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:?Set JWT_SECRET}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: travel-platform

# Production seed data configuration — default is false for production safety; can be opted-in via SEED_DATA_ENABLED=true
seed:
  data:
    enabled: ${SEED_DATA_ENABLED:false}
