spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/travel_platform
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWtleS1mb3ItZGV2LW9ubHktMjAyNC1iYXNlNjQtc2VjcmV0LWtleS11c2UtMTI4Yml0cw==}
    access-token-expiration-ms: 3600000  # 1 hour
    refresh-token-expiration-ms: 604800000  # 7 days
    issuer: travel-platform
