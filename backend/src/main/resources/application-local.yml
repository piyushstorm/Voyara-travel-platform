spring:
  datasource:
    url: jdbc:h2:mem:travel_platform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

seed:
  data:
    enabled: true

email:
  provider: ${EMAIL_PROVIDER:gmail}

payment:
  provider: ${PAYMENT_PROVIDER:razorpay}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}
  test:
    mode: ${RAZORPAY_TEST_MODE:true}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}

messagecentral:
  enabled: ${MESSAGECENTRAL_ENABLED:false}
  customer-id: ${MESSAGECENTRAL_CUSTOMER_ID:}
  email: ${MESSAGECENTRAL_EMAIL:}
  password: ${MESSAGECENTRAL_PASSWORD:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWtleS1mb3ItZGV2LW9ubHktMjAyNC1iYXNlNjQtc2VjcmV0LWtleS11c2UtMTI4Yml0cw==}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: travel-platform
